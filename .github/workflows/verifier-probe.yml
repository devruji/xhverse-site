name: Verifier HTTP investigation

on:
  pull_request:
    branches: [development]
    paths:
      - scripts/ci/verify-deployment.ts
      - .github/workflows/verifier-probe.yml

permissions:
  contents: read

jobs:
  public-probe:
    name: Compare public verifier clients
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - name: Compare default and identified clients without credentials
        run: |
          bun - <<'JS'
          const records = [];
          for (const userAgent of [null, 'XHVerse-DeploymentVerifier/1.0 (+https://github.com/devruji/xhverse-site)']) {
            for (const path of ['/sitemap-index.xml', '/', '/blog', '/tools']) {
              const headers = {'Cache-Control': 'no-cache', ...(userAgent ? {'User-Agent': userAgent} : {})};
              const response = await fetch('https://xhverse.co' + path, {headers,signal:AbortSignal.timeout(15000)});
              const record = {client:userAgent ? 'identified' : 'default',path,status:response.status,
                mitigated:response.headers.get('cf-mitigated'),ray:response.headers.get('cf-ray')};
              await response.arrayBuffer();
              records.push(record);
              console.log(JSON.stringify(record));
            }
          }
          await Bun.write('verifier-http-probe.json', JSON.stringify(records,null,2));
          if (records.some(record=>record.client==='identified' && record.status!==200)) process.exitCode=1;
          JS
      - name: Verify complete live production with the identified client
        if: github.actor == 'devruji' && github.head_ref == 'codex/fix-production-verification-403' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: xhverse-site-git
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: dde9f0319ac99926215e3f6d8f5c0b3a6d36cd28
        run: |
          bun -e 'await Bun.write(process.env.RUNNER_TEMP + "/routes.json", JSON.stringify(["/", "/blog/*", "/tools/*", "/about", "/cv", "/services", "/gallery"]));'
          bun scripts/ci/verify-deployment.ts --sha "$EXPECTED_SHA" --routes-file "$RUNNER_TEMP/routes.json" --output live-production-verification.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verifier-http-probe
          path: |
            verifier-http-probe.json
            live-production-verification.json
          retention-days: 7
