name: CI

on:
  push:
    branches: [main, development]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  deployments: write

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Cache dependencies + Playwright
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-deps-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            bunx playwright install-deps chromium 2>/dev/null || true
          else
            bunx playwright install --with-deps chromium
          fi

      - name: Typecheck + Build + Test
        run: bun run check

      - name: Upload artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v5
        with:
          name: site-dist
          path: dist/
          retention-days: 5

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 5

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "## Test Coverage" >> "$GITHUB_STEP_SUMMARY"
            node -e "const s=require('./coverage/coverage-summary.json').total; console.log('| Metric | % |\\n|---|---:|\\n| Lines | '+s.lines.pct+' |\\n| Statements | '+s.statements.pct+' |\\n| Functions | '+s.functions.pct+' |\\n| Branches | '+s.branches.pct+' |')" >> "$GITHUB_STEP_SUMMARY"
          fi

  report-production-deployment:
    name: Report Production Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Create GitHub deployment record
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          deployment_payload="$(
            jq -n \
              --arg ref "$SHA" \
              --arg environment "xhverse-site (Production)" \
              '{
                ref: $ref,
                task: "deploy",
                environment: $environment,
                description: "Production deployment reported after CI passed on main.",
                auto_merge: false,
                required_contexts: [],
                production_environment: true
              }'
          )"

          deployment_id="$(
            gh api "repos/$REPO/deployments" \
              --method POST \
              --input - \
              --jq ".id" <<< "$deployment_payload"
          )"

          status_payload="$(
            jq -n \
              --arg environment "xhverse-site (Production)" \
              --arg environment_url "https://xhverse.co" \
              --arg log_url "$RUN_URL" \
              --arg description "Production deployment is up to date for $REF at $SHA." \
              '{
                state: "success",
                environment: $environment,
                environment_url: $environment_url,
                log_url: $log_url,
                description: $description
              }'
          )"

          gh api "repos/$REPO/deployments/$deployment_id/statuses" \
            --method POST \
            --input - <<< "$status_payload"
