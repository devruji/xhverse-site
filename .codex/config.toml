model_reasoning_effort = "high"
sandbox_mode = "workspace-write"

[agents]
max_threads = 4
max_depth = 1

# Keep the xhverse Codex skill surface intentionally small. Global artifact and
# knowledge plugins are useful elsewhere, but they add several unrelated skills
# here and can trigger skill-description context-budget truncation.
[plugins."documents@openai-primary-runtime"]
enabled = false

[plugins."spreadsheets@openai-primary-runtime"]
enabled = false

[plugins."presentations@openai-primary-runtime"]
enabled = false

[plugins."pdf@openai-primary-runtime"]
enabled = false

[plugins."template-creator@openai-primary-runtime"]
enabled = false

[plugins."notion@openai-curated"]
enabled = false

[plugins."supabase@openai-curated"]
enabled = false

# xhverse uses Cloudflare for Pages, Access, Turnstile, security headers, and
# deploy checks. Keep Cloudflare enabled here so it is available only when
# working in this repo.
[plugins."cloudflare@openai-curated"]
enabled = true

[mcp_servers.cloudflare-api]
url = "https://mcp.cloudflare.com/mcp"
bearer_token_env_var = "CLOUDFLARE_API_TOKEN"

# Browser automation uses Playwright with a profile isolated from personal tabs.
[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@0.0.83", "--isolated", "--browser", "chrome"]
startup_timeout_sec = 60

# Disable inherited Computer Use in this repository.
# Codex requires a transport even when disabled; fail closed if re-enabled.
[mcp_servers.cua_repl]
command = "/usr/bin/false"
enabled = false

# Supabase is scoped to the xhverse project so agents cannot enumerate other account projects.
[mcp_servers.supabase]
url = "https://mcp.supabase.com/mcp?project_ref=jxfpnfliioqbhzznaphd"
bearer_token_env_var = "SUPABASE_ACCESS_TOKEN"

# Supabase is repo-scoped because xhverse owns public forms, admin data, and migrations.
[apps.asdk_app_69d3e5ee6a708191baa733f7b8931995.tools.supabase_apply_migration]
approval_mode = "approve"

[apps.asdk_app_69d3e5ee6a708191baa733f7b8931995.tools.supabase_execute_sql]
approval_mode = "approve"
