model_reasoning_effort = "high"
sandbox_mode = "workspace-write"

[agents]
max_threads = 4
max_depth = 1

# xhverse uses Cloudflare for Pages, Access, Turnstile, security headers, and deploy checks.
# Keep Cloudflare enabled here so it is available only when working in this repo.
[plugins."cloudflare@openai-curated"]
enabled = true

[mcp_servers.cloudflare-api]
url = "https://mcp.cloudflare.com/mcp"
bearer_token_env_var = "CLOUDFLARE_API_TOKEN"

# Supabase is repo-scoped because xhverse owns public forms, admin data, and migrations.
[apps.asdk_app_69d3e5ee6a708191baa733f7b8931995.tools.supabase_apply_migration]
approval_mode = "approve"

[apps.asdk_app_69d3e5ee6a708191baa733f7b8931995.tools.supabase_execute_sql]
approval_mode = "approve"
